[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatch"
version = "0.1.0"
description = "日本市場向け 商品価格監視アプリ（Amazon・楽天・Yahoo!・価格.com・家電量販店）"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.setuptools.package-data]
"pricewatch.web" = ["templates/*.html"]
